name: tests

# The repo had no CI at all. Its sibling hoopR-nba-stats-raw showed what that
# costs: a test sat broken for months because nothing collected it. These tests
# touch no network.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # ~109k files under wnba_stats/ plus 30 .bundles/ tarballs. Smaller
          # than the NBA sibling's 490k but still pointless to clone for offline
          # tests, and the sparse form keeps the job at ~30s.
          sparse-checkout: |
            python
            tests
            scripts
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Install
        # --frozen: a PR must not silently re-resolve the lockfile. The daily
        # workflow is the only place that runs `uv lock --upgrade`.
        run: uv sync --frozen --dev

      - name: Tests
        # `archive` tests read the committed wnba_stats/ tree, which is not
        # checked out here. They run on the runner that already holds it.
        run: uv run pytest -q -m "not archive"

      - name: Lint
        run: uv run ruff check python tests

      - name: Shell syntax
        # scripts/ is bash-only by convention and the scrape entry points are
        # not otherwise exercised by CI. This catches an unparseable script
        # before a nightly sweep discovers it at 06:30 UTC.
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
